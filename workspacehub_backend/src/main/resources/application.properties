# WorkspaceHub production-ready configuration
spring.application.name=WorkspaceHub

# Railway supplies PORT at runtime; local default remains 8080
server.port=${PORT:8080}

# Set these environment variables in Railway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Do not auto-run workspacehub.sql: it contains DROP TABLE and can erase bookings
spring.sql.init.mode=never

# Frontend origin; set FRONTEND_URL in Railway after deploying Vercel
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
